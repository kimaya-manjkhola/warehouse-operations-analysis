name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest
      - name: Run the full analysis
        run: python run_analysis.py --no-publish --outdir ci_outputs
      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: analysis-outputs
          path: ci_outputs/
